name: Deploy Bivane website

# 触发方式：
#  - push 到 master（官网改动）自动重新部署
#  - push 到 registry-pages（registry: publish r/ 自动发布）也自动重新部署
#  - 也可在 Actions 页手动 Run workflow
# 始终从 master 构建：官网（/）+ 文档参考站（/docs/），并从 registry-pages 取最新 r/ 打进站点根 /r/。
# 一个站点、三种内容共存：/ 官网、/docs/ 组件参考、/r/ shadcn registry。
# 前置（一次性）：仓库 Settings → Pages → Source 设为 "GitHub Actions"。
on:
  push:
    branches: [master, registry-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发覆盖
concurrency:
  group: pages-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 固定 checkout master：官网源码始终来自 master，与触发分支无关
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run web:build
      # 把线上最新发布的 registry 一并打进站点根 /r/，保持 shadcn registry 可访问
      - name: Bundle registry into site
        run: |
          git fetch origin registry-pages
          git archive origin/registry-pages r | tar -x
          mkdir -p apps/web/dist/r
          cp -r r/* apps/web/dist/r/
      # 构建文档参考站并合进站点 /docs/（apps/docs vite base 已设为 /bivane/docs/）
      - name: Build docs site
        run: |
          npm run docs:props
          npm run docs:registry
          npm run docs:examples
          npm run docs:build
          cp -r apps/docs/dist apps/web/dist/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
